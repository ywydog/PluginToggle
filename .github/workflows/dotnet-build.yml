name: Build PluginToggle

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Pack on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install PowerShell (用于生成插件包 MD5 摘要)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https software-properties-common
          wget -q "https://packages.microsoft.com/config/ubuntu/$(. /etc/os-release && echo $VERSION_ID)/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Restore dependencies
        run: dotnet restore PluginToggle.csproj

      - name: Build CIPX
        run: dotnet build PluginToggle.csproj --configuration Release --no-restore

      - name: Upload .cipx artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugintoggle-cipx
          path: cipx/PluginToggle.cipx
          if-no-files-found: error
